# Netlify deployment. The OpenNext adapter (@netlify/plugin-nextjs) is applied
# automatically for Next.js and supports Cache Components, Server Actions,
# next/image (via Netlify Image CDN) and next.config redirects.
# See docs/deploy-netlify.md for environment variables and DNS cutover.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Response headers live in next.config.ts (shared with Vercel).
